[package]
name = "compiler-bf-target"
version = "0.1.0"
edition = "2024"

# Shared across all targets
[dependencies]
logos = "0.16"
miette = { version = "7.6", features = ["fancy", "serde"] }
thiserror = "2.0"
serde = { version = "1.0.228", features = ["derive"] }
maplit = "1.0.2"

# Wasm only
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
serde-wasm-bindgen = "0.6.5"

# Native only (CLI)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", optional = true }

[features]
advanced-output = ["dep:crossterm"]

[patch.crates-io]
miette = { path = "../3rd_party/miette" }

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.dev.wasm-bindgen]
dwarf-debug-info = true

[package.metadata.commands]
build = "wasm-pack build --release --target bundler --out-dir ../web-frontend/src/wasm --out-name compiler_bf_target"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"

